packages:
  - "packages/*"

catalog:
  "@edge-runtime/vm": 5.0.0
  "@types/node": 24.19.2
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vitest: 5.0.4

# Vite+ ships Vite and Vitest. Every package that asks for them gets the Vite+ builds.
overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest

# Wait 7 days before resolving newly published package versions, so the ecosystem has time to
# detect and yank compromised releases before CI installs them.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Keep release-age exceptions exact so later releases do not bypass the cooling period.
minimumReleaseAgeExclude:
  # Reviewed releases: the Alchemy that @samebase/alchemy-identity-hub 0.2.0 targets, the version
  # that @samebase/alchemy-convex 0.11.0 needs, published 2026-10-24 00:43 UTC. Remove after
  # 2026-10-31 00:44 UTC, when the 7-day cooling period is complete.
  - "alchemy@2.0.0-beta.84"
  - "@alchemy.run/node-utils@2.0.0-beta.84"
blockExoticSubdeps: true
trustPolicy: no-downgrade
allowBuilds:
  esbuild: true
