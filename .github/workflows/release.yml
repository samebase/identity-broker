# Publishes the chosen package when its package.json version is not on npm yet, with provenance
# through npm trusted publishing (the npm trusted publisher of each package names this file). CI runs
# first for the same commit. The tag <name>@<version> records a published version.
name: Release

# A run is manual and publishes one package.
on:
  workflow_dispatch:
    inputs:
      package:
        description: The package to publish
        required: true
        type: choice
        options:
          - "@samebase/identity-broker"
          - "@samebase/alchemy-identity-hub"

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: publish
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Read the package version
        id: version
        run: |
          case "$PACKAGE" in
            "@samebase/identity-broker") dir=packages/identity-broker ;;
            "@samebase/alchemy-identity-hub") dir=packages/alchemy-identity-hub ;;
            *) echo "Unknown package $PACKAGE" >&2; exit 1 ;;
          esac
          name=$(node -p "require('./$dir/package.json').name")
          if [ "$name" != "$PACKAGE" ]; then
            echo "$dir/package.json names $name, not $PACKAGE" >&2
            exit 1
          fi
          version=$(node -p "require('./$dir/package.json').version")
          tag="$name@$version"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if npm view "$tag" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already on npm; nothing to publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      # pnpm pack replaces catalog: versions with real ones.
      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        env:
          PACKAGE_DIR: ${{ steps.version.outputs.dir }}
        run: |
          tarball=$(cd "$PACKAGE_DIR" && pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          npx --yes npm@11.21.0 publish "$tarball" --access public --provenance

      - name: Tag the release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
